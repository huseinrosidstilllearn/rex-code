# Rex Code — Docker Compose (Linux / macOS)
# Secrets are read from .env (never committed). config.json is mounted so you
# can tweak providers/models without rebuilding.
#
#   docker compose up --build
#   open http://localhost:8000

services:
  rex-code:
    build: .
    container_name: rex-code
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./workspace:/app/workspace
      - ./workflows:/app/workflows
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    restart: unless-stopped