# Rex Code — Docker Compose (Linux / macOS)
# Runs the native TUI inside an interactive container.
# Secrets are read from .env (never committed). config.json is mounted so you
# can tweak providers/models without rebuilding.
#
#   docker compose run --rm rex-code

services:
  rex-code:
    build: .
    container_name: rex-code
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./workspace:/app/workspace
      - ./workflows:/app/workflows
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    restart: unless-stopped