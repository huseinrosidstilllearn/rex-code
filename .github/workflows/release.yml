name: Release

# Push a tag like v1.0.1 and every OS artifact builds automatically:
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PyInstaller bundle
        run: python -m PyInstaller installer/windows/rex.spec --noconfirm

      - name: Smoke test frozen exe
        run: dist/RexCode/rex.exe --version

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path rex/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "App version: $v"

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer/windows/rexcode.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          body_path: RELEASE_NOTES.md

  linux-macos:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: rex-linux-x64
            exe: dist/RexCode/rex
          - os: macos-latest
            artifact: rex-macos-arm64
            exe: dist/RexCode/rex
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PyInstaller bundle
        run: python -m PyInstaller installer/windows/rex.spec --noconfirm

      - name: Smoke test frozen binary
        run: ${{ matrix.exe }} --version

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }}.zip RexCode
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          body_path: RELEASE_NOTES.md

  checksums:
    needs: [windows-installer, linux-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.zip' \) -print0 | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach checksums to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
