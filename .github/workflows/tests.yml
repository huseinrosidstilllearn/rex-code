name: Tests

# Quality gate: the full 43-suite local harness runs on every push to main
# and every pull request, so a broken module can never reach a release tag.
# (Before this workflow, only test_packaging.py ran in CI — during releases.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: windows-latest  # same runner as the release pipeline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full check harness
        run: python run_all_checks.py
